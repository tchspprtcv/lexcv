services:
  postgres:
    image: postgres:16-alpine
    container_name: lexcv_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lexcv_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexcv_net
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lexcv_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - lexcv_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexcv_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  backend:
    image: ghcr.io/tchspprtcv/lexcv/backend:latest
    pull_policy: always
    container_name: lexcv_backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Arranque em dois tempos (ver DEPLOYMENT.md, "Database Schema — Two-Stage Boot").
      # Ambas as chaves sao interpoladas do ambiente/.env; os valores por omissao
      # reproduzem exactamente os literais anteriores ("true" e "update"). Quem nao
      # define nada nao ve diferenca nenhuma: a instalacao so sai do estagio 1 quando
      # o operador o decidir explicitamente no .env, nunca por efeito de um deploy.
      SEED_ENABLED: "${SEED_ENABLED:-true}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}"
      # eFatura (Phase 136): so SIMULADO existe neste build; qualquer outro valor impede o
      # arranque. A forma ":-" tambem cobre uma variavel definida mas vazia, que de outro modo
      # chegaria ao backend como "" e abortaria o arranque. Transmissao: valores sinteticos de
      # teste, iguais aos de application.yml, validos so em SIMULADO.
      EFATURA_MODE: "${EFATURA_MODE:-SIMULADO}"
      EFATURA_TRANSMISSOR_NIF: "${EFATURA_TRANSMISSOR_NIF:-999999999}"
      EFATURA_SOFTWARE_CODIGO: "${EFATURA_SOFTWARE_CODIGO:-LEXCVSIM}"
      EFATURA_SOFTWARE_NOME: "${EFATURA_SOFTWARE_NOME:-LexCV}"
      EFATURA_SOFTWARE_VERSAO: "${EFATURA_SOFTWARE_VERSAO:-3.0.0}"
      # Email fiscal (Phase 137, ENTR-03/ENTR-06): todos opcionais. SMTP_HOST vazio = envio "nao
      # configurado" (a aplicacao arranca e emite normalmente). A forma ":-" tambem cobre uma variavel
      # definida mas vazia. Com SMTP_HOST definido, SMTP_FROM e obrigatorio. Credenciais so via .env.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-${MINIO_ENDPOINT}}
    volumes:
      - lexcv_uploads:/app/uploads
    networks:
      - lexcv_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  frontend:
    image: ghcr.io/tchspprtcv/lexcv/frontend:latest
    pull_policy: always
    container_name: lexcv_frontend
    depends_on:
      - backend
    environment:
      BACKEND_API_ORIGIN: http://backend:8080
      NEXT_PUBLIC_API_BASE_PATH: /api/v1
    networks:
      - lexcv_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  webpage:
    image: ghcr.io/tchspprtcv/lexcv/webpage:latest
    pull_policy: always
    container_name: lexcv_webpage
    depends_on:
      - backend
    environment:
      BACKEND_API_ORIGIN: http://backend:8080
      NEXT_PUBLIC_API_BASE_PATH: /api/v1
    networks:
      - lexcv_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lexcv_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@lexcv.cv}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      SCRIPT_NAME: /pgadmin
    volumes:
      - lexcv_pgadmin_data:/var/lib/pgadmin
    networks:
      - lexcv_net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: lexcv_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    entrypoint:
      - sh
      - -c
      - |
        echo 'alcv.tech, www.alcv.tech {
            handle /api/* {
                reverse_proxy backend:8080
            }
            handle /pgadmin* {
                reverse_proxy pgadmin:80 {
                    header_up X-Script-Name /pgadmin
                }
            }
            @webpage {
                path / /landing-static/*
            }
            handle @webpage {
                reverse_proxy webpage:3000
            }
            handle {
                reverse_proxy frontend:3000
            }
        }' > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - webpage
      - pgadmin
    networks:
      - lexcv_net
    restart: unless-stopped

volumes:
  lexcv_pgdata_v2:
  lexcv_uploads:
  caddy_data:
  caddy_config:
  lexcv_minio_data:
  lexcv_pgadmin_data:

networks:
  lexcv_net:
    driver: bridge
