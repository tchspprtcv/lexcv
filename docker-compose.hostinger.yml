services:
  postgres:
    image: postgres:16-alpine
    container_name: lexcv_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lexcv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexcv_net
    restart: unless-stopped

  backend:
    image: ghcr.io/tchspprtcv/lexcv/backend:latest
    container_name: lexcv_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SEED_ENABLED: ${SEED_ENABLED:-false}
    volumes:
      - lexcv_uploads:/app/uploads
    networks:
      - lexcv_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  frontend:
    image: ghcr.io/tchspprtcv/lexcv/frontend:latest
    container_name: lexcv_frontend
    depends_on:
      - backend
    environment:
      BACKEND_API_ORIGIN: http://backend:8080
      NEXT_PUBLIC_API_BASE_PATH: /api/v1
    networks:
      - lexcv_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: lexcv_caddy
    ports:
      - "80:80"
      - "443:443"
    entrypoint:
      - sh
      - -c
      - |
        echo ":80 {
            handle /api/* {
                reverse_proxy backend:8080
            }
            handle {
                reverse_proxy frontend:3000
            }
        }" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
    depends_on:
      - frontend
      - backend
    networks:
      - lexcv_net
    restart: unless-stopped

volumes:
  lexcv_pgdata:
  lexcv_uploads:
  caddy_data:

networks:
  lexcv_net:
    driver: bridge
