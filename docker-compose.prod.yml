services:
  postgres:
    restart: unless-stopped

  backend:
    image: ${REGISTRY:-ghcr.io/tchspprtcv/lexcv}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # WR-01 follow-up (Phase 120 code review): docker-compose.yml's base "8089:8080" publish
    # is a multi-value `ports` key, which Compose concatenates across -f layers rather than
    # letting an override file that omits `ports:` clear it -- so without this, the backend
    # stayed reachable directly on the VPS host port 8089 even in prod, bypassing Caddy
    # entirely and undermining the assumption (see AuthController.login) that Caddy is the
    # sole ingress for /api/*. `!reset` is the Compose Specification's explicit "clear the
    # inherited value" merge tag; empirically verified with `docker compose config` that this
    # removes the published port from the merged config while docker-compose.yml (used alone
    # for local dev) is untouched and keeps host access to 8089 for local testing.
    ports: !reset []
    # eFatura (Phase 136): o Compose funde os mapas `environment` entre camadas -f, por isso
    # producao fixa SIMULADO aqui explicitamente mesmo que a base mude. So SIMULADO existe neste
    # build; qualquer outro valor impede o arranque.
    environment:
      EFATURA_MODE: "${EFATURA_MODE:-SIMULADO}"
      EFATURA_TRANSMISSOR_NIF: "${EFATURA_TRANSMISSOR_NIF:-999999999}"
      EFATURA_SOFTWARE_CODIGO: "${EFATURA_SOFTWARE_CODIGO:-LEXCVSIM}"
      EFATURA_SOFTWARE_NOME: "${EFATURA_SOFTWARE_NOME:-LexCV}"
      EFATURA_SOFTWARE_VERSAO: "${EFATURA_SOFTWARE_VERSAO:-3.0.0}"
      # Email fiscal (Phase 137, ENTR-03/ENTR-06): todos opcionais. SMTP_HOST vazio = envio "nao
      # configurado" (a aplicacao arranca e emite normalmente). A forma ":-" tambem cobre uma variavel
      # definida mas vazia. Com SMTP_HOST definido, SMTP_FROM e obrigatorio. Credenciais so via .env.
      # Compose junta os mapas environment entre camadas -f: repetido aqui para que a
      # producao fixe os mesmos defaults seguros mesmo que a base mude.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  frontend:
    image: ${REGISTRY:-ghcr.io/tchspprtcv/lexcv}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  webpage:
    image: ${REGISTRY:-ghcr.io/tchspprtcv/lexcv}/webpage:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  caddy:
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      CADDY_MINIO_USER: ${CADDY_MINIO_USER}
      CADDY_MINIO_PASSWORD_HASH: ${CADDY_MINIO_PASSWORD_HASH}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
