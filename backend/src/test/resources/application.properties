# WR-02 (Phase 91 code review): these are intentionally NOT a real, reachable datasource. Every
# *IT class MUST pair @AutoConfigureTestDatabase(Replace.NONE) with @ServiceConnection (see
# NotificacaoRepositoryIT/ParecerVersaoConcorrenciaIT) so Testcontainers' dynamic
# JdbcConnectionDetails bean overrides these properties entirely. If a future @DataJpaTest ever
# forgets one of those two annotations, this bogus host makes the test fail fast and loudly
# instead of silently connecting to whatever Postgres happens to be listening on localhost:5432
# on a developer's machine.
spring.datasource.url=jdbc:postgresql://this-property-must-be-overridden-by-ServiceConnection:5432/lexcv_test
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=create-drop
