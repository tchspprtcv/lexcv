server:
  port: ${SERVER_PORT}
  error:
    include-message: always

spring:
  application:
    name: lexcv-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          validation:
            mode: none
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # Phase 136 (Pitfall 7) / Phase 137: AlertasDiariosJob (06:00) + FiscalOutboxJob (~30 s) +
  # EmailFiscalOutboxJob (~30 s) partilham o scheduler, mais uma thread de folga; com o valor por
  # omissão do Boot (1) um job atrasaria os outros.
  task:
    scheduling:
      pool:
        size: 4

app:
  seed:
    enabled: ${SEED_ENABLED}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_ACCESS_EXPIRATION_MS}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS}
  # Phase 136 (DFE-03): adaptador eFatura. Só SIMULADO existe neste build; qualquer outro valor
  # (REAL, minúsculas, vazio) impede o arranque (EfaturaConfig).
  efatura:
    modo: ${EFATURA_MODE:SIMULADO}
    # Bloco Transmission do DFE (gate G9): valores sintéticos de teste, válidos só em SIMULADO.
    # Substituir pelos reais (código homologado, NIF do transmissor) no milestone de ligação real.
    transmissao:
      nif-transmissor: ${EFATURA_TRANSMISSOR_NIF:999999999}
      software-codigo: ${EFATURA_SOFTWARE_CODIGO:LEXCVSIM}
      software-nome: ${EFATURA_SOFTWARE_NOME:LexCV}
      software-versao: ${EFATURA_SOFTWARE_VERSAO:3.0.0}
    outbox:
      intervalo: PT30S
      atraso-inicial: PT20S
      lote: 20
      lease: PT2M
    simulado:
      # Alavanca de teste: torna toda a comunicação simulada transitoriamente falhada (nunca um sucesso).
      falhas-forcadas: false
  # Phase 137 (ENTR-06): envio do documento fiscal por email. Todos os valores são opcionais;
  # SMTP_HOST vazio = não configurado (a aplicação arranca e emite normalmente). SMTP_HOST definido
  # sem um SMTP_FROM válido impede o arranque (EmailConfig). Nunca usar spring.mail.* (137-SPIKE C).
  email:
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:}
      starttls: ${SMTP_STARTTLS:true}
    outbox:
      intervalo: PT30S
      atraso-inicial: PT40S
      lote: 10
      lease: PT2M

minio:
  endpoint: ${MINIO_ENDPOINT}
  # Public-facing URL embedded in presigned download links. Defaults to MINIO_ENDPOINT.
  # Override when the backend reaches MinIO via an internal hostname that is not
  # reachable from a browser (e.g. Docker service name vs. public domain).
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  presigned-url-expiry: ${MINIO_PRESIGNED_EXPIRY:3600}
