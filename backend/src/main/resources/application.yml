server:
  port: ${SERVER_PORT}
  error:
    include-message: always

spring:
  application:
    name: lexcv-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          validation:
            mode: none
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  seed:
    enabled: ${SEED_ENABLED}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_ACCESS_EXPIRATION_MS}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS}

minio:
  endpoint: ${MINIO_ENDPOINT}
  # Public-facing URL embedded in presigned download links. Defaults to MINIO_ENDPOINT.
  # Override when the backend reaches MinIO via an internal hostname that is not
  # reachable from a browser (e.g. Docker service name vs. public domain).
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  presigned-url-expiry: ${MINIO_PRESIGNED_EXPIRY:3600}
